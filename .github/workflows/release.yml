name: release

# Builds installers for every platform and attaches them to a draft GitHub Release.
# `bundle.externalBin` isn't in tauri.conf.json (it'd break `cargo check`/`pnpm tauri dev`
# for everyone, since Tauri checks those files exist at build time) — it's injected here,
# after scripts/fetch-sidecars.mjs has downloaded doxygen/typst for this job's target.
# Its generated config also bundles Doxygen's Windows runtime DLLs.
# Sidecars are named "diagramator-doxygen"/"diagramator-typst", not plain "doxygen"/"typst":
# Linux packaging installs externalBin next to the main executable, i.e. straight into
# /usr/bin, where a plain "doxygen" collides with the system doxygen package.
#
# TAURI_SIGNING_PRIVATE_KEY(_PASSWORD) are optional: set them (see src-tauri/tauri.conf.json's
# `plugins.updater.pubkey` for the matching public key) to also get a signed `latest.json`
# for tauri-plugin-updater. Without them, installers still build, just without self-update.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# Avoid overlapping publication runs for the same tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
    steps:
      - name: find or create the shared release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = context.ref.replace(/^refs\/tags\//, '');
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const matches = releases.filter(release => release.tag_name === tag);
            if (matches.length > 1) {
              throw new Error(`Multiple releases exist for ${tag}; choose the intended release before uploading.`);
            }
            if (matches.length === 1) return matches[0].id;
            const { data } = await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, name: `Diagramator ${tag}`,
              target_commitish: context.sha, draft: true, prerelease: false,
            });
            return data.id;

  release:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: pnpm install

      - name: test release and sidecar helpers
        run: node --test scripts/release.test.mjs scripts/sidecar-files.test.mjs

      - name: fetch doxygen/typst sidecars
        run: node scripts/fetch-sidecars.mjs --triple ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: "Diagramator ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: '--config src-tauri/binaries/sidecars.conf.json ${{ matrix.args }}'

  verify-release:
    needs: [prepare-release, release]
    runs-on: ubuntu-latest
    steps:
      - name: verify installers for every platform were uploaded
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number('${{ needs.prepare-release.outputs.release_id }}');
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id, per_page: 100,
            });
            const version = context.ref.replace(/^refs\/tags\/v/, '');
            const expected = [
              `Diagramator_${version}_x64_en-US.msi`,
              `Diagramator_${version}_x64-setup.exe`,
              `Diagramator_${version}_aarch64.dmg`,
              `Diagramator_${version}_x64.dmg`,
              `Diagramator_${version}_amd64.deb`,
              `Diagramator-${version}-1.x86_64.rpm`,
              `Diagramator_${version}_amd64.AppImage`,
            ];
            const names = new Set(assets.map(asset => asset.name));
            const missing = expected.filter(name => !names.has(name));
            if (missing.length) throw new Error(`Release is missing installers: ${missing.join(', ')}`);
            core.info(`Verified ${expected.length} installers in release ${release_id}.`);
