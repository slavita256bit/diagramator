[package]
name = "diagram-core"
description = "Diagram IR, Doxygen XML parsing and layout for Diagramator"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
roxmltree = "0.20"
thiserror = "2"
tempfile = "3"
base64 = "0.22"

